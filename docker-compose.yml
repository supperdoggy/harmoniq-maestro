services:
  mongo:
    image: mongo:7
    container_name: harmoniq-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh \"mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@localhost:27017/admin\" --quiet --eval \"db.runCommand({ ping: 1 }).ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  album-queue:
    build:
      context: .
      dockerfile: album-queue/Dockerfile
    container_name: harmoniq-album-queue
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DATABASE_NAME: ${MONGO_DATABASE}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_WHITELIST: ${BOT_WHITELIST}
      WEBHOOK_URL: ${WEBHOOK_URL}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  spotdl-wapper:
    build:
      context: .
      dockerfile: spotdl-wapper/Dockerfile
    container_name: harmoniq-spotdl-wapper
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DATABASE_NAME: ${MONGO_DATABASE}
      ACQUISITION_BACKEND: ${ACQUISITION_BACKEND:-spotdl}
      ACQUISITION_AUDIO_FORMAT: ${ACQUISITION_AUDIO_FORMAT:-mp3}
      ACQUISITION_COMMAND_TIMEOUT: ${ACQUISITION_COMMAND_TIMEOUT:-30m}
      ACQUISITION_STAGING_PATH: ${ACQUISITION_STAGING_PATH:-/music/.staging}
      YTDLP_SEARCH_LIMIT: ${YTDLP_SEARCH_LIMIT:-10}
      YTDLP_MINIMUM_SCORE: ${YTDLP_MINIMUM_SCORE:-0.72}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1m}
      WORKER_ID: ${WORKER_ID:-}
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-45m}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-15m}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      MEDIA_OUTPUT_TEMPLATE: ${MEDIA_OUTPUT_TEMPLATE:-}
      DESTINATION: ${DESTINATION:-}
      PLAYLISTS_OUTPUT_PATH: ${PLAYLISTS_OUTPUT_PATH:-/music/playlists}
      MUSIC_LIBRARY_PATH: /music
      SLEEP_IN_MINUTES: ${SLEEP_IN_MINUTES:-1}
      SPOTDL_BINARY: ${SPOTDL_BINARY:-/usr/local/bin/spotdl}
      SPOTDL_USE_CONFIG: ${SPOTDL_USE_CONFIG:-true}
      YTDLP_BINARY: ${YTDLP_BINARY:-/usr/local/bin/yt-dlp}
      FFMPEG_BINARY: ${FFMPEG_BINARY:-ffmpeg}
      FFPROBE_BINARY: ${FFPROBE_BINARY:-ffprobe}
      MEDIA_DURATION_TOLERANCE: ${MEDIA_DURATION_TOLERANCE:-15s}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      LOKI_ENABLED: ${LOKI_ENABLED:-false}
      LOKI_URL: ${LOKI_URL:-}
    volumes:
      - ${MUSIC_LIBRARY_PATH}:/music
      - ${SPOTDL_CONFIG_PATH:-./.spotdl}:/home/appuser/.config/spotdl:ro
      # Temporary compatibility mount for the current spotDL adapter.
      - ${SPOTDL_CONFIG_PATH:-./.spotdl}:/home/appuser/.spotdl:ro
    stop_grace_period: 30s

  dynamic-playlists:
    build:
      context: .
      dockerfile: dynamic-playlists/Dockerfile
    container_name: harmoniq-dynamic-playlists
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      DATABASE_NAME: ${MONGO_DATABASE}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MUSIC_LIBRARY_PATH: /music
      PLAYLISTS_OUTPUT_PATH: ${PLAYLISTS_OUTPUT_PATH}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REFRESH_TOKEN: ${SPOTIFY_REFRESH_TOKEN:-}
      DRY_RUN: ${DRY_RUN}
    volumes:
      - ${MUSIC_LIBRARY_PATH}:/music
    command: ["sh", "-c", "while true; do ./dynamic-playlists; sleep ${DYNAMIC_PLAYLISTS_INTERVAL_SECONDS:-3600}; done"]

volumes:
  mongo_data:
